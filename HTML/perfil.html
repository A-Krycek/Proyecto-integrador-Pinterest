<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | LookBook</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="../js/design.js?v=2"></script>
</head>

<body>

    <header class="linea-principal" id="linea-perfil">

        <a href="index.html" class="contenedor-logo" id="contenedor-lobby"><span>L</span><span>O</span><span>O</span><span>K</span><span>B</span><span>O</span><span>O</span><span>K</span></a>

        <nav class="linea-perfil" id="perfil-lobby">

            <a href="index.html">Explorar</a>
            <a href="crear-pin.html">Crear</a>

        </nav>

        <div class="buscador-pines">

            <form id="formulario-busqueda" action="index.html" method="GET">

                <div class="contenedor-busqueda">

                    <input
                        type="text"
                        id="busqueda"
                        name="busqueda"
                        class="input-busqueda"
                        placeholder="Buscar ideas"
                        autocomplete="off">

                </div>

            </form>

        </div>

        <div
            class="linea-perfil-foto"
            id="perfil-navegacion-derecha">

            <a
                href="perfil.html"
                class="link-usuario"
                id="link-perfil-usuario"
                title="Mi Perfil">

                <div class="avatar-placeholder">U</div>

            </a>

            <a
                href="bienvenida.html"
                class="boton-enviar-cerrar-sesion"
                id="btn-cerrar-sesion">

                Cerrar Sesión

            </a>

        </div>

    </header>

    <main class="contenedor-principal" id="contenedor-perfil">

        <section id="cabecera-perfil-usuario">
            <div class="avatar-placeholder">U</div>
            <h1 class="perfil-nombre-completo" id="txt-nombre-completo">Usuario Invitado</h1>
            <p class="nombre-usuario" id="nombre-usuario-perfil">@usuario_invitado</p>
            <p class="perfil-biografia" id="biografia-usuario-perfil">¡Bienvenido a tu perfil de LookBook! Aquí se mostrarán tus pines creados y guardados.</p>
            <div class="perfil-seguidores-info" style="margin: 10px 0 16px; font-size: 0.95rem; color: #8C533E; display: flex; gap: 15px; font-weight: 600; justify-content: center;">
                <span id="contador-seguidores">0 seguidores</span>
                <span id="contador-seguidos">0 seguidos</span>
            </div>
            <div class="perfil-acciones">
                <button class="boton-accion-secundario" id="btn-compartir-perfil">Compartir</button>
                <button class="boton-accion-secundario" id="btn-editar-perfil">Editar Perfil</button>
                <button id="btn-seguir-perfil" style="display: none;">Seguir</button>
            </div>
        </section>
        <nav class="perfil-pestañas" id="pestañas-navegacion-perfil">
      <div class="pestaña-guardados" id="pestana-guardados-perfil">Guardados</div>
      <div class="pestaña-creados" id="pestana-creados-perfil">Creados</div>
    </nav>
        <section class="perfil-mosaico" id="perfil-mosaico-pines">
            <article class="pin-tarjeta">
                <div class="pin-imagen-contenedor">
                    <img src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='500' height='600'%3E%3Crect width='100%25' height='100%25' fill='%231e1e24'/%3E%3Ctext x='50%25' y='50%25' fill='%238e8e93' font-family='sans-serif' font-weight='bold' font-size='20' text-anchor='middle'%3EDise%C3%B1o Minimalista%3C/text%3E%3C/svg%3E" alt="Diseño Minimalista" class="pin-imagen">
                    <div class="pin-overlay">
                        <button class="boton-guardar-pin">Guardar</button>
                        <a href="ver-pin.html" class="pin-overlay-link-cover" aria-label="Ver detalle"></a>
                    </div>
                </div>
                <div class="pin-info">
                    <a href="ver-pin.html" class="pin-titulo-link">
                        <h3 class="pin-titulo-mini">Diseño Minimalista</h3>
                    </a>
                </div>
            </article>

            <article class="pin-tarjeta">
                <div class="pin-imagen-contenedor">
                    <img src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='500' height='550'%3E%3Crect width='100%25' height='100%25' fill='%23222831'/%3E%3Ctext x='50%25' y='50%25' fill='%238e8e93' font-family='sans-serif' font-weight='bold' font-size='20' text-anchor='middle'%3EInteriores Modernos%3C/text%3E%3C/svg%3E" alt="Interiores Modernos" class="pin-imagen">
                    <div class="pin-overlay">
                        <button class="boton-guardar-pin">Guardar</button>
                        <a href="ver-pin.html" class="pin-overlay-link-cover" aria-label="Ver detalle"></a>
                    </div>
                </div>
                <div class="pin-info">
                    <a href="ver-pin.html" class="pin-titulo-link">
                        <h3 class="pin-titulo-mini">Interiores Modernos</h3>
                    </a>
                </div>
            </article>
        </section>

    </main>
    <footer>
        <p class="footer-generico">&copy; 2026 LookBook - Proyecto Integrador</p>
    </footer>

    <div id="toast-container"></div>

    <script src="../js/auth.js?v=2"></script>
    <script src="../js/profile.js?v=2"></script>
</body>
</html>
