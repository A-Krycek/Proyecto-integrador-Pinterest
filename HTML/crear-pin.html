<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear</title>
    <script>
        // Redirigir a HTTP si se carga por HTTPS en S3 para evitar bloqueo de contenido mixto (API)
        if (window.location.protocol === 'https:' && window.location.hostname.includes('s3')) {
            window.location.href = window.location.href.replace('https:', 'http:').replace('.s3.amazonaws.com', '.s3-website-us-east-1.amazonaws.com');
        }
    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/design.js?v=3"></script>
</head>

<body>

    <header class="linea-principal" id="linea-perfil">

        <a href="index.html" class="contenedor-logo" id="contenedor-lobby"><span>L</span><span>O</span><span>O</span><span>K</span><span>B</span><span>O</span><span>O</span><span>K</span></a>

        <nav class="linea-perfil" id="perfil-lobby">

            <a href="index.html">Explorar</a>
            <a href="crear-pin.html" class="activo">Crear</a>
        </nav>
        <div class="buscador-pines">
            <form id="formulario-busqueda" action="index.html" method="GET">
                <div class="contenedor-busqueda">
                    <input
                        type="text"
                        id="busqueda"
                        name="busqueda"
                        class="input-busqueda"
                        placeholder="Buscar ideas"
                        autocomplete="off">
                </div>
            </form>
        </div>
        <div
            class="linea-perfil-foto"
            id="perfil-navegacion-derecha">

            <a
                href="perfil.html"
                class="link-usuario"
                id="link-perfil-usuario"
                title="Mi Perfil">
                <div class="avatar-placeholder">U</div>

            </a>
            <a
                href="bienvenida.html"
                class="boton-enviar-cerrar-sesion"
                id="btn-cerrar-sesion">

                Cerrar Sesión
            </a>
        </div>
    </header>
    <main class="contenedor-principal" id="contenedor-subir">
        <div class="linea-perfil">

            <a href="index.html">
                Volver al inicio
            </a>
        </div>
        <form id="formulario-subida" action="perfil.html" method="GET">
            <div
                class="contenedor-crear"
                id="contenedor-crear-pin">
                <section
                    class="zona-subida-archivo"
                    id="zona-arrastrar-archivo">
                    <input
                        type="file"
                        id="input-archivo-real"
                        accept="image/*"
                        required>
                        
                    <h2 class="subida-texto-principal" id="txt-estado-subida">Elige un archivo o arrástralo aquí</h2>
                    <p class="subida-texto-secundario">Recomendamos usar archivos menores a 20 MB</p>
                    
                    <button type="button" class="boton-accion-secundario" id="btn-activar-subida">Seleccionar Archivo</button>
                    
                    <div id="vista-previa-contenedor">
                        <img id="img-vista-previa" alt="Vista previa de imagen seleccionada">
                    </div>
                </section>

                <section class="formulario-creacion" id="formulario-categorias">
                  
                    <input type="text" placeholder="Añade tu título" class="crear-titulo" required id="input-titulo-pin" autocomplete="off">
                  
                    <textarea placeholder="Describe de qué trata tu Pin?" class="crear-textarea" required id="textarea-desc-pin"></textarea>
                    
                    <label for="input-tags-pin" class="label-formulario label-tags">Etiquetas</label>
                    <input type="text" placeholder="Ejemplo: diseno, arte, inspiracion" class="crear-titulo" id="input-tags-pin" autocomplete="off">

                    <div class="etica-restriccion" id="seccion-etica-subida">
                        <h3 class="etica-seccion-titulo">Configuración Ética y Accesibilidad</h3>

                        <label for="categoria-select" class="label-formulario">Categoría</label>
                        <select id="categoria-select" class="crear-select" required>
                            <option value="" disabled selected>Selecciona una categoría...</option>
                        </select>

                    </div>

                    <div class="crear-acciones">
                        <a href="index.html" class="boton-accion-cancelar">Cancelar</a>
                        <button type="submit" class="boton-enviar" id="boton-publicar">Publicar</button>
                    </div>

                </section>

            </div>
        </form>
    </main>

    <div id="toast-container"></div>
    <script src="../js/auth.js?v=3"></script>
    <script src="../js/upload.js?v=3"></script>
</body>
</html>
