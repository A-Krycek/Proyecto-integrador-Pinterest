<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar | LookBook</title>
    <script>
        // Redirigir a HTTP si se carga por HTTPS en S3 para evitar bloqueo de contenido mixto (API)
        if (window.location.protocol === 'https:' && window.location.hostname.includes('s3')) {
            window.location.href = window.location.href.replace('https:', 'http:').replace('.s3.amazonaws.com', '.s3-website-us-east-1.amazonaws.com');
        }
    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/design.js?v=3"></script>
</head>
<body>
    <header class="linea-principal" id="linea-perfil">
        <a href="index.html" class="contenedor-logo" id="contenedor-lobby"><span>L</span><span>O</span><span>O</span><span>K</span><span>B</span><span>O</span><span>O</span><span>K</span></a>
        <nav class="linea-perfil" id="perfil-lobby">
            <a href="index.html" class="activo">Explorar</a>
            <a href="crear-pin.html">Crear</a>
        </nav>
        <div class="buscador-pines">
            <form id="formulario-busqueda" action="index.html" method="GET">
                <div class="contenedor-busqueda">
                    <input
                        type="text"
                        id="busqueda"
                        name="busqueda"
                        class="input-busqueda"
                        placeholder="Buscar ideas"
                        autocomplete="off">
                </div>
            </form>
        </div>
        <div class="linea-perfil-foto" id="perfil-navegacion-derecha">
            <a href="perfil.html" class="link-usuario" id="link-perfil-usuario" title="Mi Perfil">
                <div class="avatar-placeholder">U</div>
            </a>
            <a href="bienvenida.html" class="boton-enviar-cerrar-sesion" id="btn-cerrar-sesion">
                Cerrar Sesión
            </a>
        </div>
    </header>

    <main class="contenedor-principal" id="contenedor-explorar">
        
        <div class="categorias-nav-container">
            <nav id="barra-categorias"></nav>
        </div>
        
        <section class="perfil-mosaico" id="mosaico-explorar">
            <!-- Las publicaciones se cargan dinámicamente mediante JS -->
        </section>
    </main>

    <footer>
        <p class="footer-generico">&copy; 2026 LookBook - Proyecto Integrador</p>
    </footer>

    <div id="toast-container"></div>
    <script src="../js/auth.js?v=3"></script>
    <script src="../js/app.js?v=3"></script>
</body>
</html>
