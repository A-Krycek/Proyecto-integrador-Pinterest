
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="../CSS/es.css">

</head>
<body class="cuerpo-autenticacion">
<header class="linea-principal" id="linea-autenticacion">
    <a href="bienvenida.html" class="contenedor-logo" id="contenedor-lobby">LOOKBOOK</a>
        <div class="linea-perfil" id="perfil-lobby">
            <a href="bienvenida.html">Volver al inicio</a>
        </div>
</header>
<main class="contenedor-autenticacion" id="contenedor-login">

    <div class="tarjeta-autenticacion" id="tarjeta-login">

        <h1 class="titulo-autenticacion" id="titulo-login">
            Te damos la bienvenida
        </h1>

        <p class="subtitulo-autenticacion" id="subtitulo-login">
            Inicia sesión para comenzar el viaje <br>
            <span style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-top: 6px;">(Credenciales de prueba pre-cargadas)</span>
        </p>
        <form id="formulario-autenticacion" action="index.html" method="GET">
            <div class="grupo-formulario">
                <label for="correo" class="label-formulario">Correo electrónico</label>
                <div class="contenedor-formulario">
                    <input type="email" id="correo" value="usuario@lookbook.com" class="input-formulario" required autocomplete="email">
                </div>
            </div>
            <div class="grupo-formulario">
                <label for="contraseña" class="label-formulario">Contraseña</label>
                <div class="contenedor-formulario">
                    <input type="password" id="contraseña" value="12345678" class="input-formulario" required autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="boton-enviar" id="boton-enviar-iniciar-sesion">Iniciar Sesión</button>

        </form>
        <div class="separador-autenticacion" id="separador-formulario">o continua con</div>
        <div class="footer-contenedor-autenticacion">¿Aún no eres miembro? <a href="registro.html" class="link-autenticacion" id="link-registro">Regístrate ahora</a>
      </div>

    </div>

</main>
<footer>
    <p>&copy; 2026 LookBook - Proyecto Integrador</p>
</footer>
</body>
</html>
